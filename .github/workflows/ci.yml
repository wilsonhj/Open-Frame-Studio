name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # check:owners diffs against the merge base with the PR's base branch.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every new commit must use a GitHub noreply email (CLAUDE.md).
      - run: node scripts/check-commit-identity.mjs
      # Slice branches (w2/<slice>...) may only touch their own paths (docs/OWNERS.md).
      # Skipped (exit 0) when the branch names no slice.
      - run: pnpm check:owners
        env:
          OWNERS_BASE: origin/${{ github.base_ref || 'main' }}
      - run: pnpm check:models
      # Offline: workflows vs the saved Comfy Cloud object_info snapshot.
      - run: pnpm check:graphs
      - run: pnpm lint
      - run: pnpm typecheck
      # Offline: tests run against tests/mock-comfy, never the real Comfy API.
      - run: pnpm test
        env:
          COMFY_API_KEY: ""
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # playwright.config.ts forbids this locally; on a CI runner it is the supported install.
      - run: pnpm exec playwright install --with-deps chromium
      # Offline: the app talks only to tests/mock-comfy (COMFY_BASE_URL is set by the config).
      - run: pnpm test:e2e
        env:
          COMFY_API_KEY: mock-key-not-a-secret
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
